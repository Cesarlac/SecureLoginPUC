<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-image-logo-container">
        <img th:src="@{/images/logopuc.png}" alt="Logo PUC Minas">
    </div>
    <div class="login-form">
        <h2 style="text-align: center; color: #ffffff;">Recuperar Senha</h2>
        <p style="text-align: center; margin-bottom: 20px; font-size: 14px;">
            Digite o seu e-mail para receber as instruções.
        </p>
        
        <form th:action="@{/recoverpassword}" method="post" class="login-form">
            <input type="email" name="email" placeholder="E-mail" required>

            <div class="login-button-container">
                <button type="submit">Enviar</button>
            </div>

            <p class="login-redirect-options">
                Lembrou da senha? <a th:href="@{/login}">Voltar ao login</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
