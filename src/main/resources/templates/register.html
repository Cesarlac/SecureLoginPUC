<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/logopuc.png}" alt="Logo PUC Minas">
    </div>

    <div class="register-form">
        <h2 class="register-title">Crie sua conta</h2>

        <p th:if="${erro}" th:text="${erro}" style="color: red; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 14px;"></p>

        <form th:action="@{/register}" method="post">
            <input type="text" name="username" placeholder="Username" th:value="${usernameDigitado}" required>
            <input type="email" name="email" placeholder="E-mail" th:value="${emailDigitado}" required>
            
            <input type="password" name="password" placeholder="Senha" required>
            
            <div style="font-size: 12px; color: #666; text-align: left; margin-top: -10px; margin-bottom: 12px; margin-left: 5px;">
                <strong>Requisitos da senha:</strong>
                <ul style="margin-top: 4px; margin-bottom: 0; padding-left: 20px;">
                    <li>Mínimo de 6 caracteres.</li>
                </ul>
            </div>

            <input type="password" name="confirmarSenha" placeholder="Confirmar senha" required>
    
            <div class="register-button-container">
                <button type="submit">Registrar</button>
            </div>
        </form>

        <div class="register-redirect-options">
            Já possui conta? <a th:href="@{/login}">Faça login</a>
        </div>
    </div>
</div>
</body>
</html>
